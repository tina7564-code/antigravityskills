services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-comment-api
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/social_monitor
      REDIS_URL: redis://redis:6379/0
      SENTIMENT_PROVIDER: ${SENTIMENT_PROVIDER:-mock}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16
    container_name: social-comment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_monitor"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    container_name: social-comment-redis
    restart: unless-stopped

volumes:
  pgdata:
